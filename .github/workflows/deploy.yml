name: Deploy Databricks Bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: DAB target
        required: true
        type: choice
        options: [dev, staging, prod]
      run_bootstrap:
        description: Run the idempotent operational bootstrap after deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_app_name: ${{ vars.QUETZAL_APP_NAME }}
      BUNDLE_VAR_catalog: ${{ vars.QUETZAL_CATALOG }}
      BUNDLE_VAR_schema: ${{ vars.QUETZAL_SCHEMA }}
      BUNDLE_VAR_sql_warehouse_id: ${{ vars.QUETZAL_WAREHOUSE_ID }}
      BUNDLE_VAR_workspace_id: ${{ vars.DATABRICKS_WORKSPACE_ID }}
      BUNDLE_VAR_ai_model: ${{ vars.QUETZAL_AI_MODEL }}
      BUNDLE_VAR_admin_users: ${{ vars.QUETZAL_ADMIN_USERS }}
      BUNDLE_VAR_app_user_group: ${{ vars.QUETZAL_USER_GROUP }}
      BUNDLE_VAR_app_admin_group: ${{ vars.QUETZAL_ADMIN_GROUP }}
      BUNDLE_VAR_lakebase_project: ${{ vars.QUETZAL_LAKEBASE_PROJECT }}
      BUNDLE_VAR_lakebase_branch: ${{ vars.QUETZAL_LAKEBASE_BRANCH }}
      BUNDLE_VAR_lakebase_endpoint: ${{ vars.QUETZAL_LAKEBASE_ENDPOINT }}
      BUNDLE_VAR_lakebase_database: ${{ vars.QUETZAL_LAKEBASE_DATABASE }}
      BUNDLE_VAR_lakebase_database_resource_id: ${{ vars.QUETZAL_LAKEBASE_DATABASE }}
      BUNDLE_VAR_lakebase_owner_role: ${{ vars.QUETZAL_LAKEBASE_OWNER_ROLE }}
      BUNDLE_VAR_lakebase_host: ${{ vars.QUETZAL_LAKEBASE_HOST }}
      BUNDLE_VAR_lakebase_required: ${{ vars.QUETZAL_LAKEBASE_REQUIRED }}
      BUNDLE_VAR_managed_memory_store: ${{ vars.QUETZAL_MEMORY_STORE }}
      BUNDLE_VAR_ontology_base_uri: ${{ vars.QUETZAL_ONTOLOGY_BASE_URI }}
      BUNDLE_VAR_external_research_enabled: ${{ vars.QUETZAL_EXTERNAL_RESEARCH_ENABLED }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: databricks/setup-cli@6a2e75f1f954d87503702c408deea63216c0799d # main approved 2026-09-29
        with:
          version: 1.7.0

      - name: Sanitize source
        run: python scripts/sanitize_check.py

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Render customer assets
        run: python scripts/render_assets.py --env-file config/customer.env.example

      - name: Validate bundle
        run: databricks bundle validate -t "${{ inputs.target }}"

      - name: Deploy bundle
        run: databricks bundle deploy -t "${{ inputs.target }}"

      - name: Run operational bootstrap
        if: ${{ inputs.run_bootstrap }}
        run: databricks bundle run -t "${{ inputs.target }}" quetzal_operational_bootstrap
