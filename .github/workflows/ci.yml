name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.7.5"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Sanitize repository
        run: python scripts/sanitize_check.py

      - name: Render neutral validation assets
        run: python scripts/render_assets.py --env-file config/customer.env.example

      - name: Backend tests
        run: python -m pytest -q

      - name: Python lint
        run: ruff check app.py server tests scripts

      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate
