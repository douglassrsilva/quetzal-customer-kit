bundle:
  name: quetzal-customer-kit

include:
  - resources/*.yml

sync:
  include:
    - build/generated/**
    - frontend/dist/**
  exclude:
    - .github/**
    - config/**
    - dashboards/templates/**
    - docs/**
    - frontend/node_modules/**
    - frontend/src/**
    - genie_spaces/templates/**
    - scripts/**
    - terraform/**
    - tests/**
    - .venv/**
    - .pytest_cache/**
    - "**/__pycache__/**"
    - "**/*.pyc"

variables:
  app_name:
    description: Nombre único de la aplicación Databricks en el workspace.
  catalog:
    description: Catálogo de Unity Catalog que contiene el modelo canónico de Quetzal.
  schema:
    description: Esquema de Unity Catalog dedicado a Quetzal.
  sql_warehouse_id:
    description: SQL Warehouse serverless utilizado por la aplicación, Genie y AI/BI.
  workspace_id:
    description: ID numérico del workspace utilizado en la URL embebida de AI/BI.
  ai_model:
    description: Servicio de modelo de Unity AI Gateway autorizado para Quetzal IQ.
  admin_users:
    description: Administradores iniciales de Quetzal, separados por comas.
  app_user_group:
    description: Grupo del workspace autorizado para usar la aplicación y consultar el dashboard.
  app_admin_group:
    description: Grupo del workspace autorizado para administrar la aplicación y el dashboard.
  lakebase_project:
    description: Proyecto existente de Lakebase Autoscaling.
  lakebase_branch:
    description: Rama existente de Lakebase.
    default: production
  lakebase_endpoint:
    description: Endpoint existente de Lakebase.
    default: primary
  lakebase_database:
    description: Nombre de la base PostgreSQL dedicada a Quetzal.
    default: quetzal
  lakebase_database_resource_id:
    description: ID estable del recurso DAB para la base PostgreSQL de Quetzal.
    default: quetzal
  lakebase_owner_role:
    description: Rol completo de Lakebase propietario de la base de datos.
  lakebase_host:
    description: Hostname del endpoint de Lakebase, sin credenciales.
  lakebase_required:
    description: Impide el inicio de la aplicación cuando Lakebase no está disponible.
    default: "false"
  managed_memory_store:
    description: Nombre completo del store de Managed Agent Memory.
  ontobricks_url:
    description: URL opcional de una instalación independiente de OntoBricks.
    default: DISABLED
  ontobricks_domain:
    description: Nombre de dominio OntoBricks para la ontología de Quetzal.
    default: quetzal-telecom
  ontobricks_version:
    description: Versión o revisión de OntoBricks validada para el despliegue.
    default: NOT_CONFIGURED
  ontology_base_uri:
    description: Prefijo URI de la organización utilizado en los triples del grafo de conocimiento.
    default: https://quetzal.example
  external_research_enabled:
    description: Habilita de forma explícita la investigación en fuentes web públicas.
    default: "false"
  synthetic_customer_count:
    description: Cantidad de clientes sintéticos deterministas que genera el job manual.
    default: "10000"
  synthetic_seed:
    description: Semilla utilizada por todas las expresiones deterministas de datos sintéticos.
    default: "42"
  synthetic_anchor_date:
    description: Fecha ISO que define el final estable de la ventana de observación sintética.
    default: "2026-09-29"

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  staging:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
